ily reports","General_Details":"Details","General_MonthlyReports":"Monthly reports","General_RangeReports":"Custom date ranges","General_Recommended":"Recommended","General_Visit":"Visit","General_VisitId":"Visit ID","General_VisitorID":"Visitor ID","General_VisitorIP":"Visitor IP","General_WeeklyReports":"Weekly reports","General_YearlyReports":"Yearly reports","Intl_PeriodDays":"days","Intl_PeriodMonths":"months","Live_ViewVisitorProfile":"View visitor profile","PrivacyManager_AddUserIdToSearch":"Click to add this userID to the search","PrivacyManager_AddVisitorIPToSearch":"Click to add this visitorIP to the search","PrivacyManager_AddVisitorIdToSearch":"Click to add this visitorID to the search","PrivacyManager_AnonymizeData":"Anonymize data","PrivacyManager_AnonymizeDataConfirm":"Are you sure you want to anonymize the data for the selected website(s) and time range? This action cannot be undone, data may be deleted as requested, and this process may take a long time.","PrivacyManager_AnonymizeDataNow":"Anonymize past data for the selected site and time","PrivacyManager_AnonymizeIp":"Anonymize IP","PrivacyManager_AnonymizeIpDescription":"Select \"Yes\" if you want Matomo not to track fully qualified IP-Addresses.","PrivacyManager_AnonymizeIpHelp":"This action cannot be undone. If enabled, for all visits during this duration the IP will be anonymized by at least 2 bytes, for example '192.168.xxx.xxx'. If you have currently configured to anonymize by 3 bytes, then this setting will be respected and all IPs will be anonymized by 3 bytes.","PrivacyManager_AnonymizeIpInlineHelp":"Anonymize the last byte(s) of visitors IP addresses to comply with your local privacy laws\/guidelines.","PrivacyManager_AnonymizeIpMaskLengtDescription":"Select how many bytes of the visitors' IPs should be masked.","PrivacyManager_AnonymizeLocation":"Anonymize Location","PrivacyManager_AnonymizeLocationHelp":"This action cannot be undone. Re-evaluates the location based on the anonymized IP (at least 2 bytes of the IP will be anonymized).","Ecommerce_AnonymizeOrderIdNote":"Because an Order ID can be cross-referenced with another system, typically an ecommerce shop, the Order ID may count as personal information under the GDPR. When you enable this option, an Order ID will be automatically anonymized so no personal information will be tracked.","PrivacyManager_AnonymizeProcessInfo":"This action may take a long time and will therefore not be executed right away. You will be able to follow the current state of the process below. The anonymization should typically start within one hour.","PrivacyManager_AnonymizeReferrer":"Anonymize Referrer","PrivacyManager_AnonymizeReferrerNote":"Matomo stores from which URL (referrer) a user comes to your site. In some cases such a URL may contain information that can be considered personal information. If you want to prevent such information to be tracked you can restrict the amount of referrer data that Matomo will store when a visitor enters your website. The more information is removed from the referrer information, the less likely personal information will be recorded. The more information you remove from the referrer, the less clear it will be how a visitor came to your website.","PrivacyManager_AnonymizeRowDataFrom":"Anonymize all raw data starting from:","PrivacyManager_AnonymizeRowDataTo":"Anonymize all raw data up to:","PrivacyManager_AnonymizeSites":"Anonymize the data of this site(s)","PrivacyManager_AnonymizeUserId":"Replace User ID with a pseudonym","PrivacyManager_AnonymizeUserIdHelp":"When you enable this option, the User ID will be replaced by a pseudonym to avoid directly storing and displaying personally identifiable information such as an email address. In technical terms: given your User ID, Matomo will process the User ID pseudonym using a salted hash function.<br\/><br\/><em>Note: replacing with a pseudonym is not the same as anonymisation. In GDPR terms: the User ID pseudonym still counts as personal data. The original User ID could still be identified if certain additional information is available (which only Matomo and your data processor has access to).<\/em>","PrivacyManager_AskingForConsent":"Asking for consent","PrivacyManager_AwarenessDocumentation":"Awareness & documentation","PrivacyManager_AwarenessDocumentationDesc1":"Inform your visitors through a clear privacy notice whenever you\u2019re collecting personal data.","PrivacyManager_AwarenessDocumentationDesc2":"Inform your users in your privacy policy about what data you collect and how the data is used.","PrivacyManager_AwarenessDocumentationDesc3":"Make your team aware that you are using Matomo Analytics and %1$swhat data is being collected by your analytics platform%2$s.","PrivacyManager_AwarenessDocumentationDesc4":"Document your use of Matomo within your %1$sinformation asset register%2$s.","PrivacyManager_AwarenessDocumentationIntro":"Inform your users clearly and transparently, and make your colleagues aware of the data being collected and how it is used:","PrivacyManager_BackgroundColor":"Background Color","PrivacyManager_ConsentManagementPlatforms":"Consent Management Platforms","PrivacyManager_ConsentManagementPlatformsIntro":"Matomo supports integration with popular Consent Management Platforms (CMPs):","PrivacyManager_ConsentManagementPlatformsOutro":"If you do not use one of the above consent managers, you can implement %1$stracking with consent using the Matomo JavaScript API%2$s.","PrivacyManager_ConsentNotRequiredCondition1":"Do not require consent for any analytics;","PrivacyManager_ConsentNotRequiredCondition2":"Do not require consent for analytics that do not process personal data;","PrivacyManager_ConsentNotRequiredCondition3":"Allow consent exemptions for first-party, aggregated analytics with opt-out options;","PrivacyManager_ConsentNotRequiredCondition4":"Do not apply to certain tracking methods such as Matomo Log Analytics or Matomo SDK.","PrivacyManager_ConsentNotRequiredIntro":"You may be able to use Matomo without a consent banner if the applicable laws:","PrivacyManager_ConsentRequirements":"Understanding Consent Requirements","PrivacyManager_ConsentRequirementsIntro":"Some privacy laws require you to obtain your visitors' or users' consent before tracking their activity on your website or app. Depending on the applicable laws, consent may be required for one or both of the following reasons:","PrivacyManager_ConsentRequirementsReasonPersonalData":"Processing of personal data (GDPR and similar laws).","PrivacyManager_ConsentRequirementsReasonStorage":"Accessing or storing data on a visitor's device (ePrivacy laws).","PrivacyManager_ApplyStyling":"Apply a custom style","PrivacyManager_BuildYourOwn":"Build Your Own","PrivacyManager_DBPurged":"DB purged.","PrivacyManager_DataProcessingAgreement":"Data Processing Agreement","PrivacyManager_DataProcessingAgreementIntro1Linked":"The %1$sMatomo Cloud Data Processing Agreement (DPA)%2$s is important for businesses established in the territory of a member state of the European Economic Area, the UK or Switzerland or you are otherwise subject to the territorial scope of the General Data Protection Regulation (GDPR).","PrivacyManager_DataProcessingAgreementIntro2":"The Matomo Cloud Data Processing Agreement (DPA) is incorporated into the Matomo Cloud Terms and Conditions and applies automatically to Matomo Cloud. We do not act as processors for self-hosted Matomo On-Premise instances and for this reason the DPA does not apply.","PrivacyManager_DataRetention":"Data retention","PrivacyManager_DataRetentionInMatomo":"Data retention for data stored in Matomo:","PrivacyManager_DataRetentionOverall":"The overall data retention rate for your privacy policy is the raw data retention rate. Please note that aggregated reports may contain personal data as well. If you are using features like User ID, Custom Variables, Custom Dimension, or track personal data in other ways such as events, page URLs or page titles, etc, then the overall data retention rate for your privacy policy is the higher of the two.","PrivacyManager_DeleteAggregateReportsDetailedInfo":"When you enable this setting, all aggregated reports will be deleted. Aggregated reports are generated from the raw data and represent aggregated data from several individual visits. For example, the \"Country\" report lists aggregated numbers to see how many visits you have gotten from each country.","PrivacyManager_DeleteBothConfirm":"You are about to enable both raw data deletion and report data deletion. This will permanently remove your ability to view old analytics data. Are you sure you want to do this?","PrivacyManager_DeleteDataDescription":"You can configure Matomo to regularly delete old raw data and\/or aggregated reports to keep your database small or to meet privacy regulations such as GDPR.","PrivacyManager_DeleteDataInterval":"Delete old data every","PrivacyManager_DeleteLogsConfirm":"You are about to enable raw data deletion. If old raw data is removed, and reports haven't already been created, you will not be able to see historical past analytics data. Are you sure you want to do this?","PrivacyManager_DeleteLogsOlderThan":"Delete logs older than","PrivacyManager_DeleteOldAggregatedReports":"Delete old aggregated report data","PrivacyManager_DeleteOldRawData":"Regularly delete old raw data","PrivacyManager_DeleteRawDataInfo":"The raw data contains all details about each individual visit and each action your visitors took. When you delete raw data, the deleted information won't be available anymore in the visitor log. Also if you later decide to create a segment, the segmented reports won't become available for the time frame that has been deleted since all aggregated reports are generated from this raw data.","PrivacyManager_DeleteReportsConfirm":"You are about to enable report data deletion. If old reports are removed, you will have to re-process them in order view them. Are you sure you want to do this?","PrivacyManager_DeleteReportsInfo2":"If you delete old reports, they may be re-processed again from your RAW data when you request them.","PrivacyManager_DeleteReportsInfo3":"If you have also enabled \"%s\", then the reports data you're deleting will be permanently lost.","PrivacyManager_DeleteReportsOlderThan":"Delete reports older than","PrivacyManager_DeleteSchedulingSettings":"Schedule old data deletion","PrivacyManager_DeleteSelectedVisits":"Delete selected visits","PrivacyManager_DeleteVisitsConfirm":"Are you sure you want to delete the selected visits? This action cannot be undone.","PrivacyManager_DeletionFromMatomoOnly":"Please also note that any data will be only deleted from the Matomo database but not from your webserver logs. Also note that if you re-import any historical data, for example from logs, that any previously deleted data may be imported again.","PrivacyManager_DoNotTrack_Description":"Do Not Track is a technology and policy proposal that enables users to opt out of tracking by websites they do visit, including analytics services, advertising networks, and social platforms.","PrivacyManager_DoNotTrack_Disabled":"Matomo is currently tracking all visitors, even when they specified \"I do not want to be tracked\" in their web browsers.","PrivacyManager_DoNotTrack_DisabledMoreInfo":"We recommend enabling DoNotTrack support to respect your visitors' privacy","PrivacyManager_DoNotTrack_Enabled":"You are currently respecting your users Privacy, Bravo!","PrivacyManager_DoNotTrack_EnabledMoreInfo":"When users have set their web browser to \"I do not want to be tracked\" (DoNotTrack is enabled) then Matomo will not track these visits.","PrivacyManager_DoNotTrack_SupportDNTPreference":"Support Do Not Track preference","PrivacyManager_DoNotTrack_Deprecated":"The support for the Do Not Track header has been deprecated. As more browsers have either started automatically sending this header without giving users the option to change it or have completely discontinued support for it, we no longer recommend enabling this option. This feature may be completely removed in one of the upcoming major releases.","PrivacyManager_ExportSelectedVisits":"Export selected visits","PrivacyManager_ExportingNote":"In case you are exporting the data to exercise the right of access, please make sure the selected visits are actually performed by the data subject you want to export the data for.","PrivacyManager_EPrivacyAnonymousTrackingConsent":"As a result, even anonymous tracking may require consent in some jurisdictions.","PrivacyManager_EPrivacyCheckLocalRules":"To ensure compliance, always check the specific ePrivacy rules in the countries where you operate.","PrivacyManager_EPrivacyConsentRequired":"Visitors must provide consent before any information is stored or accessed on their devices (e.g., setting cookies, using local storage, tag managers, using tracking pixels, URL tracking, browser detecting extensions, using JavaScript to set cookies, access device information, load scripts, keystrokes or mouse movements, etc.).","PrivacyManager_EPrivacyDirectiveArticle53Intro":"Article 5(3) of the ePrivacy Directive is particularly important for website owners, as it states that:","PrivacyManager_EPrivacyExampleAuthenticationSecurity":"Trackers used for authentication or security","PrivacyManager_EPrivacyExampleCartBilling":"Storing content of a cart or bill user for purchases","PrivacyManager_EPrivacyExampleConsentStatus":"Storing consent status","PrivacyManager_EPrivacyExampleLoadBalancing":"Load balancing of equipment","PrivacyManager_EPrivacyExamplePersonalisation":"Personalising user interface use, when such personalisation is an intrinsic and expected element of the service","PrivacyManager_EPrivacyExceptionsExist":"Exceptions exist where the storage or access is:","PrivacyManager_EPrivacyFurtherInformationTitle":"Further Information on ePrivacy Compliance","PrivacyManager_EPrivacyFurtherInfoDirectiveAndAnalytics":"ePrivacy Directive, National Implementations and Website Analytics","PrivacyManager_EPrivacyFurtherInfoFrenchVisitors":"How do I configure Matomo without tracking consent for French visitors (CNIL exemption)?","PrivacyManager_EPrivacyFurtherInfoTdddgCompliance":"Configure Matomo Analytics for TDDDG (TTDSG) compliance?","PrivacyManager_EPrivacyFurtherInfoWithoutConsent":"Can I use Matomo Analytics without asking for consent or cookie banner?","PrivacyManager_EPrivacyIntro":"Unlike GDPR and similar privacy laws that focus on the protection of personal data, the ePrivacy Directive regulates the access to and storage of data on users\u2019 devices \u2013 whether or not the data includes personal data.","PrivacyManager_EPrivacyLaws":"ePrivacy Laws","PrivacyManager_EPrivacyNationalImplementationAnalyticsExempt":"Some countries recognise certain website analytics as consent-exempt, provided they meet specific conditions (for example France, Spain, Italy, the Netherlands).","PrivacyManager_EPrivacyNationalImplementationPriorConsent":"Others require prior consent for all tracking technologies that access or store data on visitors' devices, even for first-party, anonymised analytics.","PrivacyManager_EPrivacyNationalImplementationsTitle":"Different National Implementations Across the EU","PrivacyManager_EPrivacyStrictlyNecessaryExamplesTitle":"Strictly necessary for providing an online service explicitly requested by the user, for example","PrivacyManager_EPrivacyTransmissionException":"Required solely for the transmission of a communication.","PrivacyManager_FindDataSubjectsBy":"Find data subjects by","PrivacyManager_FindMatchingDataSubjects":"Find matching data subjects","PrivacyManager_FontColor":"Font Color","PrivacyManager_FontFamily":"Font Family","PrivacyManager_FontSize":"Font Size","PrivacyManager_ForceCookielessTracking":"Force tracking without cookies","PrivacyManager_ForceCookielessTrackingDescription":"Enabling this option will automatically update %1$s, so it contains some additional code to ensure all trackers won't use cookies. Additionally Matomo will ignore all tracking cookies on server side.","PrivacyManager_ForceCookielessTrackingDescription2":"Cookies will be disabled even when using the consent methods in Matomo tracker and calling for example the cookie consent methods won't enable cookies.","PrivacyManager_ForceCookielessTrackingDescriptionNotWritable":"The JS tracker file \"%1$s\" is not writable which is required for this feature to fully work. When the JS tracker file is not writable, then the cookies will be only ignored on the server side but cookies might be still set in the browser. To solve this issue you or a system administrator need to change the file permissions so your webserver can change this file.","PrivacyManager_GdprChecklistDesc1":"If you are processing personal data of European citizens through Matomo, even if your company is located outside Europe, you need to fulfil GDPR obligations and this guide will help you.","PrivacyManager_GdprChecklistDesc2":"Find below our tools that let you exercise your users\u2019 rights easily, and the list of actions to take to make your use of Matomo compliant with the GDPR and safeguard your data. Visit our %1$sGDPR User guide%2$s to learn even more.","PrivacyManager_GdprChecklists":"GDPR checklists","PrivacyManager_GdprOverview":"GDPR Overview","PrivacyManager_GdprOverviewApplicabilityCondition1":"Has a presence in the EU (that is any stable setup, like an office or local representative, where data processing happens or decisions about data are made).","PrivacyManager_GdprOverviewApplicabilityCondition2":"Does not have a presence in the EU but targets individuals in the EU by:","PrivacyManager_GdprOverviewApplicabilityCondition2Detail1":"Offering goods or services (even for free) specifically to EU residents; or","PrivacyManager_GdprOverviewApplicabilityCondition2Detail2":"Tracking or monitoring the behaviour of people while they are in the EU.","PrivacyManager_GdprOverviewApplicabilityIntro":"If your Matomo configuration processes personal data, GDPR will apply to your organisation, if it:","PrivacyManager_GdprOverviewIntro1":"The General Data Protection Regulation (GDPR) is a regulation which strengthens and unifies data protection for all individuals within the European Union (EU).","PrivacyManager_GdprOverviewIntro2":"If you take steps to ensure no personal data is collected in Matomo, then you may not be concerned by the GDPR for Matomo (if you track no IP addresses, no user IDs, no geolocation data, etc.), but ePrivacy laws will still apply.","PrivacyManager_GdprOverviewIntro3":"GDPR defines personal data broadly, covering any information that can directly or indirectly identify a person.","PrivacyManager_GdprOverviewIntro4":"GDPR does not apply to anonymised personal data, but anonymisation threshold is high.","PrivacyManager_GdprOverviewKeyPoint1":"The GDPR doesn't just apply to businesses in the EU - it can also affect companies outside the EU in some cases.","PrivacyManager_GdprOverviewMatomoPersonalData":"If you are using Matomo, you may be processing various personal data, depending on your configuration.","PrivacyManager_GdprTools":"GDPR Tools","PrivacyManager_GdprToolsOverviewHint":"In case you do not know what GDPR is, please refer to the %1$sGDPR overview%2$s.","PrivacyManager_GdprToolsPageIntro1":"This page has been designed for you to exercise data subject rights.","PrivacyManager_GdprToolsPageIntro2":"You can exercise:","PrivacyManager_GdprToolsPageIntroAccessRight":"The right of access to all data (and data portability).","PrivacyManager_GdprToolsPageIntroEraseRight":"The right to erase some or all data (and rectification).","PrivacyManager_GeolocationAnonymizeIpNote":"Note: Geolocation will have approximately the same results with 1 byte anonymized. With 2 bytes or more, Geolocation will be inaccurate.","PrivacyManager_GetPurgeEstimate":"Get purge estimate","PrivacyManager_DetermineConsentNeedAction1":"Identify which privacy laws apply to your website's data collection and tracking.","PrivacyManager_DetermineConsentNeedAction2":"Decide how to configure Matomo based on whether you process personal data and\/or access or store information on visitors' devices.","PrivacyManager_DetermineConsentNeedIntro":"To determine whether you need to ask for consent, you should:","PrivacyManager_HandlingPreviouslyCollectedData":"Handling Previously Collected Data","PrivacyManager_HandlingPreviouslyCollectedDataDetails":"Anonymisation must be irreversible, meaning the data can no longer be linked to an individual. If anonymisation is not possible, deletion may be required. Anonymisation within Matomo environment only can be managed through the Privacy Manager in Matomo.","PrivacyManager_HandlingPreviouslyCollectedDataIntro":"If consent is required under applicable laws and you cannot prove that you previously obtained valid consent, you may need to delete or anonymise the previously tracked users' raw data.","PrivacyManager_HowToObtainValidConsent":"How to obtain a valid consent?","PrivacyManager_IndividualsRights":"Individuals' rights","PrivacyManager_IndividualsRightsAccess":"The right of access: %1$ssearch for a data subject%2$s and export all of their data.","PrivacyManager_IndividualsRightsChildren":"If you offer online services to children and rely on consent to collect information about them, then you may need a parent or guardian\u2019s consent in order to process the children\u2019s personal data lawfully.","PrivacyManager_IndividualsRightsErasure":"The right to erasure: %1$ssearch for a data subject%2$s and delete some or all of their data.","PrivacyManager_IndividualsRightsInform":"The right to be informed: inform your users with a clear privacy notice.","PrivacyManager_IndividualsRightsIntro":"Exercise the rights of your users with our GDPR-friendly procedures:","PrivacyManager_IndividualsRightsObject":"The right to object: %1$slet your users easily opt-out%2$s on your privacy policy page.","PrivacyManager_IndividualsRightsPortability":"The right to data portability: %1$ssearch for a data subject%2$s and export all of their data.","PrivacyManager_IndividualsRightsRectification":"The right to rectification: you can %1$ssearch for a data subject%2$s and delete some or all of their data.","PrivacyManager_KeepBasicMetrics":"Keep basic metrics (visits, page views, bounce rate, goal conversions, ecommerce conversions, etc.)","PrivacyManager_KeepBasicMetricsReportsDetailedInfo":"When you enable this setting, some numeric key performance indicators won't be deleted.","PrivacyManager_KeepDataFor":"Keep all data for","PrivacyManager_KeepReportSegments":"For kept data above, also keep segmented reports","PrivacyManager_LastAction":"Last action","PrivacyManager_LastDelete":"Last deletion was on","PrivacyManager_LeastDaysInput":"Please specify a number of days greater than %s.","PrivacyManager_LeastMonthsInput":"Please specify a number of months greater than %s.","PrivacyManager_MatchingDataSubjects":"Matching data subjects","PrivacyManager_NextDelete":"Next scheduled deletion in","PrivacyManager_NoDataSubjectsFound":"No data subjects found","PrivacyManager_OptOutAppearance":"Customise the opt-out appearance","PrivacyManager_OptOutCustomize":"Customise the opt-out iframe","PrivacyManager_OptOutHtmlCode":"HTML code to embed on your website","PrivacyManager_OptOutPreview":"Preview of the Opt-out as it will appear on your website","PrivacyManager_OptOutUseTracker":"Use the Matomo tracker code to set the opt out","PrivacyManager_OptOutUseStandalone":"Use self-contained code to set the opt out","PrivacyManager_OptOutCodeTypeExplanation":"The opt-out can either be set by using the Matomo tracker code which means less code to add to your website pages and less likely to need updating in the future, or using standalone code which is more likely to work for visitors with script blockers but will need to be updated on each webpage if you change any settings.","PrivacyManager_OptOutExplanationCookieDeletion":"In the opt-out section of your webpage, such as your Privacy Policy, inform visitors that some browsers automatically delete opt-out cookies if the website is not visited regularly. The deletion time varies by browser (e.g., Safari after 7 days, Firefox after 45 days, Chrome after 400 days). These timeframes may change over time.","PrivacyManager_OptOutExplanationCookieDeletionCheck":"Visitors who do not visit your website regularly but wish to remain opted out of analytics should check the opt-out setting whenever they return to ensure their opt-out status is still recognised by their browser.","PrivacyManager_OptOutExplanationIntro":"This code will create a section where your visitors can opt-out of Matomo tracking by setting an opt-out cookie in their web browser. See below (or %1$sclick here%2$s) to view the content that will be displayed.","PrivacyManager_OptOutRememberToTest":"Remember to test your opt-out!","PrivacyManager_OptOutRememberToTestBody":"To ensure that your opt-out is working properly with your website it is recommended to perform the following quick test after adding the opt out code.","PrivacyManager_OptOutRememberToTestStep1":"Browse to your main website page.","PrivacyManager_OptOutRememberToTestStep2":"Once the page has loaded you should see the opt-out box.","PrivacyManager_OptOutRememberToTestStep3":"Unchecking the checkbox to opt-out should show the opted-out message.","PrivacyManager_OptOutRememberToTestStep4":"Checking the checkbox to opt-in should show the opted-in message.","PrivacyManager_PseudonymizeUserId":"Replace User ID with a pseudonym","PrivacyManager_PseudonymizeUserIdNote":"When you enable this option, the User ID will be replaced by a pseudonym to avoid directly storing and displaying personally identifiable information such as an email address. In technical terms: given your User ID, Matomo will process the User ID pseudonym using a salted hash function.","PrivacyManager_PseudonymizeUserIdNote2":"Note: replacing with a pseudonym is not the same as anonymisation. In GDPR terms: the User ID pseudonym still counts as personal data. The original User ID could still be identified if certain additional information is available (which only Matomo and your data processor has access to).","PrivacyManager_PurgeNow":"Purge DB Now","PrivacyManager_PurgeNowConfirm":"You are about to permanently delete data from your database. Are you sure you want to continue?","PrivacyManager_PurgingData":"Purging data\u2026","PrivacyManager_RawDataNeverRemoved":"visits and actions raw data are <strong>never<\/strong> deleted.","PrivacyManager_RawDataRemovedAfter":"all visits and actions raw data are deleted after %1$s.","PrivacyManager_ReportsDataSavedEstimate":"Database size","PrivacyManager_ReportsNeverRemoved":"aggregated reports are <strong>never<\/strong> deleted.","PrivacyManager_ReportsRemovedAfter":"all aggregated reports are deleted after %1$s.","PrivacyManager_ResultIncludesAllVisits":"The found results include all visits without any time restriction and include today.","PrivacyManager_ResultTruncated":"More than %1$s results were found and the result was truncated to the first %1$s visits.","PrivacyManager_SaveSettingsBeforePurge":"You have changed the data deletion settings. Please save them before starting a purge.","PrivacyManager_SearchForDataSubject":"Search for a data subject.","PrivacyManager_SecurityProcedures":"Security procedures","PrivacyManager_SecurityProceduresDesc1":"Apply our %1$ssecurity recommendations%2$s in order to keep your Matomo data safe.","PrivacyManager_SecurityProceduresDesc2":"Check that you have a written contract with the company providing you the Matomo server or hosting which ensures %1$sappropriate safeguards are provided%2$s.","PrivacyManager_SecurityProceduresDesc3":"Include Matomo in your %1$sdata breach procedure%2$s.","PrivacyManager_SecurityProceduresDesc4":"Include Matomo in your %1$sdata privacy impact assessment (DPIA)%2$s, if applicable.","PrivacyManager_SecurityProceduresIntro":"Inform your users clearly and transparently, and make your colleagues aware of the data being collected and how it is used:","PrivacyManager_SeeAlsoOurOfficialGuidePrivacy":"See also our official guide: %1$sWeb Analytics Privacy%2$s","PrivacyManager_SelectWebsite":"Select a website","PrivacyManager_SiteDataNotAvailable":"Data unavailable","PrivacyManager_SiteDataNotAvailableCertainSites":"Data restricted for some sites","PrivacyManager_VisitorLogsProfilesDisabledMessage":"Data for this site is not displayed because Visits logs or Visitor Profile are disabled. This ensures compliance with privacy settings and regulations.","PrivacyManager_VisitorLogsProfilesSiteNamesDisabledMessage":"Data for some sites is not displayed because Visits logs or Visitor Profile are disabled for these sites. This ensures compliance with privacy settings and regulations.","PrivacyManager_PleaseEnableVisitorLogsProfiles":"If you need to access data for this site, please enable Visits logs or Visitor Profile in the %1$ssite settings%2$s.","PrivacyManager_PleaseEnableVisitorLogsProfilesSites":"If you need to access data for these sites, please enable Visits logs or Visitor Profile in the %1$ssite settings%2$s.","PrivacyManager_TeaserHeader":"On this page, you can customize Matomo to make it privacy compliant with existing legislations, by: %1$s anonymizing the visitor IP%2$s, %3$s automatically remove old visitor logs from the database%4$s, and %5$s anonymize previously tracked raw users' data%6$s.","PrivacyManager_TrackingOptOut":"Let users opt-out of tracking","PrivacyManager_UsersOptOutIntro":"Matomo is dedicated to providing privacy on the Internet. If you are permitted to track your visitors without prior opt-in or consent but are required to provide an opt-out option - or if you simply choose to offer one - this section explains how to set it up.<br \/><br \/>To allow your visitors to opt-out of Matomo Web Analytics, add the following HTML code on one of your website pages, for example in a Privacy Policy page. %1$sRead this guide to learn more.%2$s","PrivacyManager_ShowIntro":"Show introduction text","PrivacyManager_UnderstandingYourLegalObligations":"Understanding your legal obligations","PrivacyManager_UnderstandingYourLegalObligationsBulletExemptions":"<b>Exemptions for Privacy-Friendly Analytics:<\/b> Some analytics solutions meeting strict conditions (e.g., anonymisation, aggregation, no cross-site tracking, opt-out provided, other requirements) can be used without consent, but with opt-out enabled (France, Spain, Italy, the Netherlands). Read more about the %1$sCNIL consent exemption for Matomo%2$s.","PrivacyManager_UnderstandingYourLegalObligationsBulletNoComplianceRequirements":"<b>No compliance requirements:<\/b> The number of jurisdictions allowing completely unrestricted use of analytics is continually decreasing due to evolving privacy laws.","PrivacyManager_UnderstandingYourLegalObligationsBulletPersonalDataOnly":"<b>Consent Required for Personal Data Processing Only:<\/b> Consent is only required if analytics process personal data. Other forms of website analytics are permitted without consent (e.g., Switzerland, Japan, China (P.R.C.)).","PrivacyManager_UnderstandingYourLegalObligationsBulletStrictConsent":"<b>Strict Consent Requirement:<\/b> Any tracking that requires access to or storing data on a visitor\u2019s terminal device and is not strictly necessary requires prior consent, even if no personal data is collected (e.g., ePrivacy implementing laws such as TDDDG (Germany)).","PrivacyManager_UnderstandingYourLegalObligationsBulletTransparencyOptOut":"<b>Transparency & Opt-Out Model:<\/b> Consent is not required for analytics. Other legal basis can be relied on if personal data is processed. Opt-out is required for marketing and profiling or minors\u2019 data (e.g., U.S. consumer privacy laws).","PrivacyManager_UnderstandingYourLegalObligationsIntro1":"Matomo provides privacy-focused analytics that can be configured to align with any privacy law.","PrivacyManager_UnderstandingYourLegalObligationsIntro2":"Before you configure Matomo for your websites or apps, consult your legal or privacy advisers to determine which privacy laws apply to you.","PrivacyManager_UnderstandingYourLegalObligationsIntro3":"Some privacy laws have extraterritorial effect and may apply even if your business has no establishment in the given country.","PrivacyManager_UnderstandingYourLegalObligationsIntro4":"You may need visitors\u2019 consent for website analytics, depending on the privacy laws that apply and how your analytics are set up.","PrivacyManager_UnderstandingYourLegalObligationsIntro5":"Privacy laws generally fall into one of the following categories regarding regulatory requirements for website analytics:","PrivacyManager_UnsetActionColumns":"Unset action columns","PrivacyManager_UnsetActionColumnsHelp":"This action cannot be undone. A list of database columns in scope action that you want to unset. Each value for that column will be set to its default value.","PrivacyManager_UnsetVisitColumns":"Unset visit columns","PrivacyManager_UnsetVisitColumnsHelp":"This action cannot be undone. A list of database columns in scope visit that you want to unset. Each value for that column will be set to its default value. Please note that if the same column exists in scope 'conversion', then this column will be deleted as well","PrivacyManager_UseAnonymizeIp":"Anonymize Visitors' IP addresses","Ecommerce_UseAnonymizeOrderId":"Anonymize Order ID","PrivacyManager_UseAnonymizeTrackingData":"Anonymize Tracking Data","PrivacyManager_UseAnonymizedIpForVisitEnrichment":"Also use the Anonymized IP addresses when enriching visits.","PrivacyManager_UseAnonymizedIpForVisitEnrichmentDesc":"Plugins such as <b>Geo Location via IP<\/b> and <b>Provider<\/b> enhance visitor metadata. By default, they rely on anonymized IP addresses. If you select \"No\", the full, non-anonymized IP address will be used instead, which reduces privacy but increases data accuracy.","PrivacyManager_UseAnonymizedIpForVisitEnrichmentNote":"Plugins such as Geo Location via IP and Provider improve visitor's metadata. By default, these plugins use the anonymized IP addresses. If you select 'No', then the non-anonymized full IP address will be used instead, resulting in less privacy but better data accuracy.","PrivacyManager_UseAnonymizedIpForVisitEnrichmentReadMore":"Read more about this feature in this %1$sarticle%2$s.","PrivacyManager_UseDeleteLog":"Regularly delete old raw data from the database","PrivacyManager_UseDeleteReports":"Regularly delete old reports from the database","PrivacyManager_VisitsMatchedCriteria":"These visits match the selected criteria.","PrivacyManager_VisitsSuccessfullyDeleted":"Visits were successfully deleted","PrivacyManager_VisitsSuccessfullyExported":"Visits were successfully exported","PrivacyManager_WhenDoINeedConsent":"When do I need to ask for user consent?","PrivacyManager_ValidConsentRequirement1":"Consent must be freely given.","PrivacyManager_ValidConsentRequirement2":"Consent must be specific and informed.","PrivacyManager_ValidConsentRequirement3":"Consent must be unambiguous and express.","PrivacyManager_ValidConsentRequirement4":"Users must be able to refuse consent.","PrivacyManager_ValidConsentRequirement5":"Withdrawing consent must be as easy as giving it.","PrivacyManager_ValidConsentRequirement6":"Consent must not be bundled with other terms.","PrivacyManager_ValidConsentRequirement7":"Granular consent choices should be offered.","PrivacyManager_ValidConsentRequirement8":"Consent must be recorded as proof of compliance.","PrivacyManager_ValidConsentRequirement9":"No tracking before consent where prior consent is required.","PrivacyManager_ValidConsentRequirement10":"Consent should be refreshed periodically.","UsersManager_AllWebsites":"All websites","PrivacyManager_ConsentManager":"Conse
