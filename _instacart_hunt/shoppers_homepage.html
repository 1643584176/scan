d how much you earn."},"whyBecomeShopper":{"title":"Why become an Instacart Shopper?","reason1Title":"Earn extra money shopping for others","reason1Description":"As a shopper, you go to the grocery store like normal, except you’re getting paid to shop for others.","reason2Title":"Work whenever it works for you","reason2Description":"With no set hours or days, you can shop as much or as little as you want, anytime you want."},"shopperCarousel":{"title":"How to shop and earn","step1Title":"Get approved to shop","step1Description":"\u003ca href='https://shoppers.instacart.com/apps'\u003eDownload the shopper app\u003c/a\u003e and complete a quick setup process.","step2Title":"Choose the orders you want to shop","step2Description":"In the app, you’ll see orders you can choose to shop. Pick the one you want, then start earning.","step3Title":"Shop your customer’s order","step3Description":"With Instacart, you shop at the store like normal, except you’re shopping for other people.","step4Title":"Communicate with your customer","step4Description":"Customers love great service. If you have a question or need to give them an update, just send them a message in the app.","step5Title":"Cash out instantly and earn tips","step5Description":"Your earnings are instantly available to transfer to your bank account. And when you earn tips, you always keep 100%.","step5Note":"*Customers have 24 hours to adjust their tip amount. When this 24 hour period ends, your tips are finalized and then available for instant cashout."},"roleCards":{"title":"Which type of role is right for me?","titleNoIss":"Which type of job is right for me?","card1Title":"Shop and deliver","card1Subtitle":"Full-service shopping is a contract role.","card1Point1":"Requires a car","card1Point2":"Deliver to the customer's door","card1Point3":"Work whenever you want","card2Title":"Shop only","card2Subtitle":"Prepare orders as an Instacart employee.","card2Point1":"No car required","card2Point2":"Prepare orders at one store","card2Point3":"Schedule shifts up to 29 hrs/wk"},"faq":{"title":"Common questions","question1":"What is Instacart?","answer1":"Instacart is an app that connects you to customers who need groceries. You use the app to sign on, find orders, then shop and deliver those items to your customers. When you get paid, you can cash out instantly and you can earn even more with tips for great service.","question2":"How do I sign up to become an Instacart shopper in the U.S.?","answer2":"Just create an account at shoppers.instacart.com. After that, just download the Shopper app from the Apple App Store or the Google Play Store to complete the sign up process. When you’re approved to shop, you can sign on to shop and make money on your own schedule.","question3":"How do I get paid?","answer3":"How much an Instacart shopper earns depends on their role type and other factors.","answer3FssSubheader":"Full-service shopper in the U.S.","answer3FssDescription1":"Shoppers get paid per batch that they complete. Instacart provides estimates for your earnings on every order as well as total earnings for the week. The amount you earn per batch of orders depends on the number of items, type of items, driving distance, and effort involved in shopping and delivering. You keep 100% of customer tips. You also get opportunities to earn extra through promotions Instacart runs.","answer3FssDescription2":"As independent contractors, full-service shoppers have the flexibility to work as little or as often as they want. This means that total earnings potential depends on the individual.","question4":"What is shopping like?","answer4":"Hear from real shoppers about what its like to shop with Instacart","answer4LinkText":"in this video.","question5":"What are the requirements to become an Instacart shopper in the U.S.?","answer5":"In order to be eligible to become an Instacart shopper in the U.S., you must be at least 18 years of age, have legal authorization to work in the U.S., be able to lift up to 40lbs without accommodation, have regular access to a reliable car and have regular access to a smartphone capable of running the Instacart Shopper app.","question6":"What documents do I need to sign up?","answer6":"The first thing you’ll need to have on-hand is your contact information (the details on your driver’s license should cover this step). You will also need to have your social security number readily available. The sign up process will then ask you to set up direct deposit so you can get paid! You’ll need your banking information to complete this step.","question8":"Do I pay for groceries myself?","answer8":"Not at all. As an Instacart shopper, you’ll get a payment card from Instacart and use it at the checkout register at every store you shop. Getting a payment card is simple. New shoppers usually receive their payment card in the mail 5 to 7 business days after completing the sign up process."},"cityFaq":{"title":"Frequently Asked Questions about Instacart Shoppers in %{city}","inStoreShoppers":"in-store shoppers","fss":"Full-Service Shopper","iss":"In-Store Shopper","shopperApp":"Instacart Shopper App","fullServiceIcShopper":"full-service Instacart shopper","inStoreIcShopper":"in-store Instacart shopper","insulatedBags":"insulated bags","whyBecomeShopperQuestion":"Why should I become an Instacart shopper in %{city}?","whyBecomeShopperAnswerHtml":"\u003cp\u003eBecome your own boss and sign up to be either a full-service Instacart shopper or an in-store Instacart shopper in %{city}.\u003c/p\u003e\u003cul class='list-disc'\u003e\u003cli\u003eEarn extra money shopping for others in %{city}\u003c/li\u003e\u003cli\u003eSet your schedule to work as much or as little as you want\u003c/li\u003e\u003cli\u003eGet paid daily, including tips, when you qualify for Instant Cashout\u003c/li\u003e\u003cli\u003eChoose which orders you accept to maximize your time and earnings\u003c/li\u003e\u003cli\u003eExplore %{city}'s neighborhoods by delivering to both new and familiar areas\u003c/li\u003e\u003c/ul\u003e\u003cbr /\u003e\u003cp\u003eYou must meet certain requirements to shop with Instacart depending on the Instacart shopper role you chose. Becoming an Instacart shopper in %{city} does not require any previous experience as a personal shopper — or any work experience at all. We welcome interested individuals from an array of industries and backgrounds. Shopping on the Instacart platform may be the ideal opportunity for those looking for seasonal work, flexible scheduling, home-based opportunities, temporary jobs, or a part-time position. This job works well for those seeking a home-based or entry-level position or those who can only work certain days or hours, such as after school or on weekends.\u003c/p\u003e","experienceQuestion":"Do I need any experience to be an Instacart shopper in %{city}?","experienceAnswerHtml":"\u003cp\u003eNope! You don’t need any prior work experience. We welcome interested individuals from an array of industries and backgrounds. Shopping on the Instacart platform is great for anyone looking for flexible, seasonal, home-based, entry-level, weekend, weekday, after-school, or temporary opportunities.\u003c/p\u003e\u003cp\u003eIf you already provide services as a personal shopper or are involved in the grocery or transportation industries (such as a courier, driver, truck driver, professional driver, taxi driver, food delivery driver), you might want to consider shopping with Instacart.\u003c/p\u003e","whatIsInstacartQuestion":"What is Instacart?","whatIsInstacartAnswerHtml":"\u003cp\u003eInstacart is the North American leader in online grocery delivery. Instacart shoppers offer same-day delivery and pickup services to bring fresh groceries and everyday essentials to busy people and families across the U.S. and Canada. Instacart has partnered with more than 500 beloved national, regional and local retailers to deliver from nearly 40,000 stores across more than 5,500 cities in North America. Instacart’s delivery service is available to more than 85% of U.S. households and 70% of Canadian households.\u003c/p\u003e\u003cp\u003eThe company’s cutting-edge enterprise technology also powers the ecommerce platforms of some of the world’s biggest retail players, supporting their white-label websites, applications and delivery solutions. Instacart offers an Instacart Express membership for unlimited free delivery on orders over $35. For more information, visit \u003ca href='https://www.instacart.com/'\u003ehttps://www.instacart.com\u003c/a\u003e. For anyone interested in becoming an Instacart shopper, visit \u003ca href='https://shoppers.instacart.com/'\u003ehttps://shoppers.instacart.com\u003c/a\u003e.\u003c/p\u003e","question1":"How do I become an Instacart shopper in %{city}?","answer1":"To become an Instacart shopper in %{city} you must meet the basic requirements and sign-up in the %{shopper_app_link} or %{online_link}. Once you've signed-up, if approved, you'll get an email with next steps.","answer1ShopperApp":"Shopper app","answer1Online":"online","question2":"What are the job requirements for Instacart shoppers in %{city}?","answer2Start":"In order to shop and deliver with Instacart in %{city}, you must:","answer2Li1":"Be at least 18 years old","answer2Li2":"Be eligible to work in %{country}","answer2Li3":"Have a valid driver's license and regular access to a registered vehicle","answer2Li4":"Have a smartphone that's compatible with the %{ic_shopper_app_link} (Android 5.0, iOS 9, or newer)","answer2Li5":"Be able to lift 30+ lbs with or without accommodation","answer2Li6":"Acquire a set of %{insulated_bags_link}","answer2IssInfo":"(this is not a requirement for %{iss_link})","question3":"How much do Instacart shoppers in %{city} earn?","answer3":"Instacart shoppers in %{city} can earn up to %{amount} per batch.","question4":"How are Instacart shopper earnings in %{city} calculated?","answer4Start":"Instacart shopper earnings in %{city} are based on:","answer4Li1":"Size of the order","answer4Li2":"Time of day when the order is placed","answer4Li3":"Number of items in the order and size of items in the order","answer4Li4":"How difficult each item is to shop for","answer4Li5":"Estimated delivery distance","answer4Li6":"Batch incentives, quality bonuses, peak boosts, and customer tips","question5":"How do Instacart shoppers in %{city} get paid?","answer5":"Instacart shoppers in %{city} are paid weekly via direct deposit and these payments correspond to services provided between Monday and Sunday of the previous week. If you don't have direct deposit set up, Instacart will mail you a check. Instacart also offers an Instant Cashout option for shoppers who may need the cash right away. You can access your funds via the %{app_link}","question6":"Do Instacart shoppers in %{city} see tips?","answer6":"Yes! You keep 100% of customer tips as an Instacart shopper in %{city}. Instacart does not take any portion of tip money.","question7":"What is the difference between a Full Service Shopper and an In-Store Shopper?","answer7P1":"As an Instacart shopper in %{city}, you can choose from two different shopper roles: a full-service shopper or an in-store shopper. Each has different benefits and requirements:","answer7P2":"%{fss_link} in %{city}: A full-service shopper is a contract role with Instacart and requires a car in order to deliver to customers' doors. As a full-service shopper, you have control over where, when, and how much you shop.","answer7P3":"%{iss_link} in %{city}: An in-store shopper prepares orders inside one store as an Instacart employee and does not require a car. As an in-store shopper, you can schedule shifts up to 29 hours/week.","question8":"How do Instacart shoppers in %{city} pay for groceries?","answer8":"Instacart provides shoppers in %{city} with an Instacart shopper debit card to cover the cost of groceries with a pre-approved amount for each selected batch.","question9":"Will I still earn money as an Instacart shopper in %{city} if I don't get any orders?","answer9":"No, you will not earn money as an Instacart shopper in %{city} if you do not shop or deliver any orders.","question10":"Do you have to have a car to work as an Instacart shopper in %{city}?","answer10":"If you want to be a %{fss_link} in %{city}, you must have access to a car. However, if you want to be an %{iss_link} for %{city}, you do not need a car.","answer10NoIss":"If you want to be a %{fss_link} in %{city}, you must have access to a car.","question11":"Can I work full time as an Instacart shopper in %{city}?","answer11":"It depends. You can work full time as a full-service Instacart shopper in %{city} and pick up shifts equivalent to 40 hours per week if there's enough demand. However, as an in-store Instacart shopper in %{city} you are only permitted to work up to 29 hours per week.","answer11NoIss":"You can work full time as a full-service Instacart shopper in %{city} and pick up shifts equivalent to 40 hours per week if there's enough demand.","question12":"Does Instacart pay for gas, mileage, or car maintenance in %{city}?","answer12":"As a full-service Instacart shopper in %{city} you are an independent contractor. Therefore, you use your own vehicle to handle deliveries and you pay for your own maintenance and fuel. However, as an independent contractor, you may be able to write off some of these expenses as business-related expenses when filing your taxes. Please consult a tax advisor if you have any questions.","question13":"How do taxes work as an Instacart shopper in %{city}?","answer13":"For Instacart shoppers in %{city}, your taxes will not be withheld from your pay. If you make more than $600 per tax year as an Instacart shopper in %{city}, we will send you a 1099-MISC tax form. This is a standard tax form for contract workers."},"publications":{"title":"As featured in"},"popularRetailers":{"title":"Shop from these popular stores near %{city}"},"popularStores":{"title":"These stores are available to shop near you"},"downloadApp":{"title":"Sign on, shop, and start making money","description":"Download the Shopper App to start earning and working when you want.","cta":"Text me the download link","ctaShoppers":"Send a link","termsAndConditions":"By providing my phone number above, I agree and consent to receiving messages from Instacart. Message and data rates apply. Consent not required to buy. Messages may be autodialed. Message frequency varies. Text STOP to Cancel.","placeholder":"Cell Phone Number","placeholderShoppers":"Mobile number","sendLink":"Send link","downloadIos":"Download the Shopper app in the App Store","downloadAndroid":"Download the Shopper app on Google Play","ios":"Download iOS app","android":"Download Android app","instacartDelivery":"Instacart Delivery"},"healthAndSafety":{"title":"We’re committed to the health and safety of all shoppers","description":"Our teams are working closely with health officials to make sure we're taking the appropriate precautionary measures to keep shoppers safe, including providing shoppers with safety kits.","blogCta":"Covid-19 resources"},"footer":{"copyright":"© 2020 Maplebear Inc. All rights reserved.","privacyPolicy":"Privacy Policy","privacyChoices":"Your Privacy Choices","instacart":{"header":"Instacart","careers":"Careers","latestNews":"Latest news","contactUs":"Contact us"},"shopper":{"header":"Shopper resources","fss":"Full-service shopper","jobs":"Jobs","earnings":"Earnings","shopperSupport":"Shopper support","helpCenter":"Help center"},"cities":{"header":"Top cities","viewAll":"View all cities"},"app":{"header":"Get the app","iosShopper":"iOS Shopper app","androidShopper":"Android shopper app","iosDelivery":"iOS delivery app","androidDelivery":"Android delivery app"}}}
  gon.jobsPageStrings = {"hero":{"title":"Apply to be an Instacart shopper now","subtitle":"Start by letting us know where in North America you want to shop:","alt":"Shopper unloading groceries with Instacart App open","stateTitle":"Get paid to shop and deliver in %{state}","stateSubtitle":"Download the app to sign up and start shopping in as soon as 1 hour.","stateAlt":"Instacart shopper picking up their lanyard","cityTitle":"Get paid to shop stores in your area","citySubtitle":"Sign up now and see why over 600,000 shoppers choose Instacart for flexible earnings. ","cityAlt":"Shopper pushing cart holding their phone"},"nearmeForm":{"title":"Instacart helps you find work throughout North America","subtitle":"See if we operate near you:","unitedStates":"🇺🇸 United States","canada":"🇨🇦 Canada","zipPlaceholder":"Zip code","submit":"Enter"},"breadcrumbs":{"signup":"Signup","shopperJobs":"Shopper Jobs"},"job":{"vacancy":"Are you looking for a full-time or part-time job?","benefits":"Sign up to shop with Instacart and become your own boss instead. Choose between being a [Full-Service Shopper] or an [In-Store Shopper] and start making great money on your own schedule. Enjoy the flexibility of choosing when, where, and how much you earn."},"stateInfo":{"title":{"one":"Instacart operates in 1 state","other":"Instacart operates in all 50 states","landingPages":"Shop with Instacart in all 50 states","state":"Shop with Instacart in these %{state} cities"},"subtitle":"See top cities below","description":"Find the top cities for shoppers in your state below.","seeMore":"See more","seeAll":"See all","showMore":"Show more"},"cityInfo":{"title":"Instacart operates in these %{state} Cities"},"flexibleWork":{"title":"Looking for flexible work in %{location}?","description":["Sign up to shop with Instacart and enjoy the flexibility of choosing when, where, and how much you earn.","\u003cstrong\u003eShopper\u003c/strong\u003e\u003cul\u003e\u003cli\u003e1099 position (contractor)\u003c/li\u003e\u003cli\u003eShop and deliver\u003c/li\u003e\u003cli\u003eMaximum flexibility\u003c/li\u003e\u003c/ul\u003e","As a shopper, you’ll make money to meet your goals, and make shopping lists come true for customers. Attention to detail and stellar service are the qualities that will set you apart and help you deliver excellence."]},"howInstacartWorks":{"title":"How shopping with Instacart works","items":["Shop only the orders you want.","Go to the store to pick items for the order.","Chat with customers for questions or changes.","Check out with your Instacart payment card.","Deliver the order to the customer.","Cash out as soon as 2 hours later."],"itemsIss":["Pick items for the customer at the store.","Chat with customers for questions or changes.","Check out with your Instacart payment card.","Get paid weekly, automatically."]},"storesYouCanShop":{"title":"Stores you can shop as an Instacart shopper in %{city}"},"whyShoppersChooseInstacart":{"title":"Why shoppers choose Instacart","description":"See what sets us apart, and read more about our \u003ca href=\"https://www.instacart.com/company/shopper-commitments\" class=\"underline font-medium\"\u003ecommitments\u003c/a\u003e to shoppers.","shoppers":[{"header":"Community","quote":"“It’s very unique how the \u003cspan class=\"font-bold\"\u003ecommon bond we share in the shopping community\u003c/span\u003e has brought people of all walks of life together.”","shopper":{"name":"Andrew S.","location":"Syracuse, NY"}},{"header":"Rewards","quote":"“Upside is the bees knees! From gas to groceries to eating out. You can\u0026apos;t beat the actual\u003cspan class=\"font-bold\"\u003e cash back you can see and cash out at any time.\u003c/span\u003e”","shopper":{"name":"Jocelyn P.","location":"Temecula, CA"}},{"header":"Earnings","quote":"“I can \u003cspan class=\"font-bold\"\u003eset my own schedule and do enjoyable work\u003c/span\u003e. I can work 12-hour days or take 1 or 2 deliveries, depending on my goals that week.”","shopper":{"name":"Raynah W.","location":"Chattanooga, TN"}},{"header":"Support","quote":"“Thank goodness for phone support. \u003cspan class=\"font-bold\"\u003eBeing able to speak to a person is way faster and more helpful\u003cspan\u003e than searching for answers online.”","shopper":{"name":"Selenia M.","location":"Deltona, FL"}}]},"shoppersMakeIt":{"title":"Shoppers make it happen","description":"Shopping lets you serve your community by delivering the things people need—from their favorite foods to last-minute gifts.","shopperChat":[{"chat":"I delivered comfort food and medicine to a mom with sick toddlers. She was nearly in tears when I arrived.","name":"Sarah E. | Kent, WA"},{"chat":"I delivered groceries to an elderly gentleman sent from his daughter who lives out of state. He was so thankful to have human interaction and food. I even went a few days later to bring him some more food.","name":"Timothy D. | Knoxville, TN"}]},"commonQuestions":{"title":"Common questions about shopping with Instacart","questions":[{"question":"What is Instacart?","answer":"Instacart is an app that connects you to customers who need items delivered from local stores. You use the app to view orders in your area, choose the ones you want, then shop and deliver those items to your customers. When you get paid, you can cash out in hours and earn even more with tips for great service."},{"question":"How do I sign up to become an Instacart shopper in the U.S.?","answer":"Just create an account at shoppers.instacart.com. After that, download the Shopper app from the Apple App Store or the Google Play Store to complete the signup process. Once you’re approved to shop, you can start making money on your own schedule."},{"question":"How do I get paid?","answer":"How much an Instacart shopper earns depends on their role type and other factors.\u003cbr /\u003e\u003cbr /\u003e\u003cstrong\u003eFull-service shopper in the U.S.\u003c/strong\u003e\u003cbr /\u003e\u003cbr/\u003eFull-service shoppers get paid per batch that they complete. Instacart provides estimates for your earnings on every order, and tracks your total earnings for the week. The amount you earn per batch depends on the size of the order, driving distance, and effort involved in shopping and delivering. Shoppers keep 100% of customer tips, and get opportunities to earn extra through promotions Instacart offers. Shoppers can cash out their earnings in as little as 2 hours.\u003cbr/\u003e\u003cbr/\u003eAs independent contractors, full-service shoppers have the flexibility to work as little or as often as they want. This means that total earnings potential depends on the individual."},{"question":"What are the requirements to become an Instacart shopper in the U.S.?","answer":"To be eligible to become an Instacart shopper in the U.S, you must be at least 18 years of age, have legal authorization to work in the U.S., be able to lift up to 40lbs (18kg) without accommodation, and have regular access to a reliable car and a smartphone capable of running the Instacart Shopper app."},{"question":"What documents do I need to sign up?","answer":"All you need is your driver’s license, social security number, and bank account information to set up direct deposit."},{"question":"Do I pay for groceries myself?","answer":"Not at all. As an Instacart shopper, you’ll get a payment card from Instacart and use it at the checkout register at every store you shop. Getting a payment card is simple. New shoppers usually receive their payment card in the mail 5 to 7 business days after completing the signup process."},{"question":"Where can I find additional shopper support?","answer":"You can find additional shopper resources in our Shopper Help Center available in the Instacart Shopper app.\u003cbr /\u003e\u003cbr /\u003eDownload the latest version of the Instacart app for iOS or Android to make sure you have access to current help center content and other features."}]},"commonQuestionsIss":{"title":"Common questions about shopping with Instacart","questions":[{"question":"What is Instacart?","answer":"Instacart is a service that lets customers order from local stores, for pickup or delivery. In-store shoppers work with partner retail stores to shop orders at a single location."},{"question":"How do I sign up to become an Instacart shopper in the U.S.?","answer":"Just create an account at shoppers.instacart.com. After that, download the Shopper app from the Apple App Store or the Google Play Store to complete the signup process. Once you’re approved to shop, you can start making money on your own schedule."},{"question":"How do I get paid?","answer":"How much an Instacart shopper earns depends on their role type and other factors. In-store shoppers are Instacart employees who earn an hourly wage, detailed in the initial offer letter. In-store shoppers are scheduled for shifts based on personal availability, up to 29 hours each week."},{"question":"What are the requirements to become an Instacart shopper in the U.S.?","answer":"To be eligible to become an Instacart shopper in the U.S, you must be at least 18 years of age, have legal authorization to work in the U.S., be able to lift up to 40 lbs (18kg) without accommodation, and have a smartphone capable of running the Instacart Shopper app."},{"question":"What documents do I need to sign up?","answer":"All you need is your social security number and bank account information to set up direct deposit."},{"question":"Do I pay for groceries myself?","answer":"Not at all. As an Instacart shopper, you’ll get a payment card from Instacart and use it at the checkout register at every store you shop. Getting a payment card is simple. New shoppers usually receive their payment card in the mail 5 to 7 business days after completing the signup process."}]},"becomeAShopper":{"title":"Become a shopper today","subtitle":"Sign up now and start shopping in as soon as 1 hour.","cta":"Sign up"},"signUpSteps":{"title":"Signup steps","downloadAppTitle":"Step one, done! Step two: easy.","downloadAppSubtitle":"Download the app and log in with your phone number.","body":[{"title":"Create account","description":"You must be 18+, eligible to work in the U.S., and have access to a vehicle for deliveries."},{"title":"Set up account in app","description":"Take photos of your driver’s license, and enter bank account info to get paid."},{"title":"Start earning money","description":"You’ll start seeing orders once your account is approved."}]},"signUpStepsIss":{"title":"Signup steps","downloadAppTitle":"Step one, done! Step two: easy.","downloadAppSubtitle":"Download the app and log in with your phone number.","body":[{"title":"Create account","description":"You must be 18+ and eligible to work in the U.S."},{"title":"Set up account in app","description":"Answer a few quick questions and enter bank account info to get paid."},{"title":"Start earning money","description":"You'll be able to start work once your application is approved."}]}}
