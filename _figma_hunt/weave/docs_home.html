<!-- Last-click attribution: each new external visit resets and re-captures params + referrer. -->
<!-- Forwards everything to app.weavy.ai links only. -->
<script>
(function () {
  var COOKIE_PREFIX = 'attr_';
  var OUTBOUND_HOSTS = ['app.weavy.ai'];
  // Session cookies (no max-age) - die when browser closes.
  // A new external entrance also resets them explicitly (last-click attribution).

  function setCookie(n, v) {
    document.cookie = n + '=' + encodeURIComponent(v) + '; path=/; SameSite=Lax; Secure';
  }
  function deleteCookie(n) {
    document.cookie = n + '=; max-age=0; path=/; SameSite=Lax; Secure';
  }
  function isOutbound(hostname) {
    return OUTBOUND_HOSTS.some(function (h) {
      return hostname === h || hostname.endsWith('.' + h);
    });
  }
  function listAttrCookies() {
    return document.cookie.split('; ').filter(function (c) {
      return c.indexOf(COOKIE_PREFIX) === 0;
    });
  }

  // --- Detect whether THIS pageview is a new external entrance ---
  var urlParams = new URLSearchParams(window.location.search);
  var hasIncomingParams = false;
  urlParams.forEach(function () { hasIncomingParams = true; });

  var ref = document.referrer || '';
  var refHost = '';
  try { refHost = ref ? new URL(ref).hostname.toLowerCase() : ''; } catch (e) {}
  var isInternalNav = refHost && (refHost === window.location.hostname || refHost.endsWith('.' + window.location.hostname));
  var isNewEntrance = !isInternalNav; // external referrer, or direct (no referrer)

  var tracked = {};

  if (isNewEntrance && (hasIncomingParams || refHost || !listAttrCookies().length)) {
    // === NEW SESSION: wipe previous attribution, capture fresh (last-click) ===
    listAttrCookies().forEach(function (c) {
      deleteCookie(c.split('=')[0]);
    });

    // Capture all incoming URL params
    urlParams.forEach(function (val, key) {
      if (key && val) {
        setCookie(COOKIE_PREFIX + key, val);
        tracked[key] = val;
      }
    });

    // Capture + classify the referrer for this entrance
    var source = 'direct';
    if (refHost) {
      if (/google\./.test(refHost)) source = 'google';
      else if (/bing\./.test(refHost)) source = 'bing';
      else if (/duckduckgo\./.test(refHost)) source = 'duckduckgo';
      else if (/yahoo\./.test(refHost)) source = 'yahoo';
      else if (/yandex\./.test(refHost)) source = 'yandex';
      else if (/baidu\./.test(refHost)) source = 'baidu';
      else if (/chatgpt\.com|openai\.com/.test(refHost)) source = 'chatgpt';
      else if (/perplexity\./.test(refHost)) source = 'perplexity';
      else if (/claude\.ai|anthropic\./.test(refHost)) source = 'claude';
      else if (/gemini\.google\.|bard\.google\./.test(refHost)) source = 'gemini';
      else if (/copilot\.microsoft\./.test(refHost)) source = 'copilot';
      else if (/facebook\.|instagram\.|linkedin\.|t\.co|twitter\.|x\.com|reddit\.|youtube\.|tiktok\./.test(refHost)) source = 'social';
      else source = 'referral';
    }

    tracked._referrer = ref || '(none)';
    tracked._referrer_source = source;
    tracked._landing_page = window.location.pathname;

    setCookie(COOKIE_PREFIX + '_referrer', tracked._referrer);
    setCookie(COOKIE_PREFIX + '_referrer_source', source);
    setCookie(COOKIE_PREFIX + '_landing_page', tracked._landing_page);
  } else {
    // === SAME SESSION (internal navigation): rehydrate from cookies ===
    listAttrCookies().forEach(function (c) {
      var pair = c.split('=');
      var key = pair[0].slice(COOKIE_PREFIX.length);
      if (key) tracked[key] = decodeURIComponent(pair.slice(1).join('='));
    });
    // Any params present in the current URL still take precedence
    urlParams.forEach(function (val, key) {
      if (key && val) {
        setCookie(COOKIE_PREFIX + key, val);
        tracked[key] = val;
      }
    });
  }

  // Expose immediately
  window.attributionParams = tracked;

  // --- Decorate ONLY outbound links to app.weavy.ai ---
  function decorateOutboundLinks() {
    if (Object.keys(tracked).length === 0) return;
    document.querySelectorAll('a[href]').forEach(function (link) {
      try {
        var url = new URL(link.href, window.location.origin);
        if (url.protocol !== 'https:' && url.protocol !== 'http:') return;
        if (!isOutbound(url.hostname)) return;

        var params = new URLSearchParams(url.search);
        var changed = false;

        Object.keys(tracked).forEach(function (key) {
          if (!params.has(key)) {
            params.set(key, tracked[key]);
            changed = true;
          }
        });

        if (changed) {
          url.search = params.toString();
          link.href = url.toString();
        }
      } catch (e) {}
    });
  }

  function init() {
    decorateOutboundLinks();
    if (document.body) {
      new MutationObserver(decorateOutboundLinks).observe(document.body, {
        childList: true,
        subtree: true,
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

const WEAVE_LANDING_PAGE_UID = "weave_landing_page_uid";

function getOrCreateWeaveLandingPageUid() {
    let uid = localStorage.getItem(WEAVE_LANDING_PAGE_UID);

    if (!uid) {
        uid = crypto.randomUUID();
        localStorage.setItem(WEAVE_LANDING_PAGE_UID, uid);
    }

    return uid;
}

function addLandingUidToLinks(landingUid) {
    const appHostnames = [
        "app.weavy.ai"
    ];

    document.querySelectorAll("a[href]").forEach((link) => {
        try {
            const url = new URL(link.href);

            const isAppLink = appHostnames.some(
                (hostname) => url.hostname === hostname
            );

            if (!isAppLink) {
                return;
            }

            url.searchParams.set(
                WEAVE_LANDING_PAGE_UID,
                landingUid
            );

            link.href = url.toString();
        } catch (e) {
            // Ignore invalid URLs (mailto:, tel:, anchors, etc.)
        }
    });
}

posthog.init('phc_NT2sOH8m82boUw21Q1Vsr0tQUtjpRJUIE5aoqA0En8T', {
    api_host: 'https://eu.i.posthog.com',
    person_profiles: 'identified_only', // or 'always' to create profiles for anonymous users 

    loaded: function(posthog) {
        const landingUid = getOrCreateWeaveLandingPageUid();

        posthog.register_once({
            [WEAVE_LANDING_PAGE_UID]: landingUid
        });

        addLandingUidToLinks(landingUid);
    }
});
