<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('assets/Inter.var.woff2') format('woff2-variations');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --color-bg: #ffffff;
      --color-text: #000000;
    }

    .dark {
      --color-bg: #333333;
      --color-text: #ffffff;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      user-select: none;
    }

    body.hidden {
      display: none;
    }

    video {
      width: 48px;
      height: 48px;
    }

    body.dark video {
      mix-blend-mode: lighten;
    }

    #error {
      display: none;
    }

    #error-icon {
      padding-bottom: 12px;
    }

    #error-icon-path {
      fill: var(--color-text);
    }

    #error-message {
      font-size: 13;
      font-weight: 500;
      font-family: 'Inter';
      padding-bottom: 10px;
    }

    #error-description {
      font-size: 11;
      font-family: 'Inter';
      opacity: 0.5;
      padding-bottom: 18px;
    }

    #retry-button {
      background-color: var(--color-bg);
      border: 1px solid var(--color-text);
      color: var(--color-text);
      border-radius: 6px;
      padding: 8px;
      font-family: 'Inter';
      font-size: 13px;
    }

    #invisible-draggable-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      -webkit-app-region: drag;
      z-index: 1000;
    }
  </style>
  <script>
    window.showError = function() {
      document.getElementById('error').style.display = 'block';
      document.getElementById('video').style.display = 'none';
    };

    window.hideError = function() {
      document.getElementById('error').style.display = 'none';
      document.getElementById('video').style.display = 'block';
    };

    window.setStrings = function(strings) {
      for (const [key, value] of Object.entries(strings)) {
        document.getElementById(key).innerHTML = value;
      }
    }

    window.setTheme = function(theme) {
      const SUPPORTED_THEMES = ['dark'];
      if (SUPPORTED_THEMES.includes(theme)) {
        document.body.classList.add(theme);
        document.getElementById('video').src = `assets/loading/loading_${theme}.mp4`;
      }
    }

    window.show = function() {
      document.body.classList.remove('hidden');
    }

    window.endAnimation = function() {
      const video = document.getElementById('video');

      if (video.style.display === 'none') {
        loadingScreenAPI.loadingAnimationEnded();
        return;
      }

      video.addEventListener('timeupdate', async function() {
        if (Math.abs(video.currentTime - video.duration) < 0.2) {
          video.style.display = 'none';
          await video.pause();
          loadingScreenAPI.loadingAnimationEnded();
        }
      });
    }
  </script>
</head>
<body class="hidden">
  <div id="invisible-draggable-bar"></div>

  <video id="video" autoplay loop muted>
    <source id="video-source" src="assets/loading/loading.mp4" type="video/mp4">
  </video>

  <div id="error">
    <svg id="error-icon" width="18" height="15" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path id="error-icon-path" fill-rule="evenodd" clip-rule="evenodd" d="M16.2903 13.9999L9.00011 1.03967L1.70995 13.9999L16.2903 13.9999ZM9.87168 0.54941C9.48938 -0.130241 8.51083 -0.130239 8.12853 0.549413L0.838377 13.5097C0.463412 14.1763 0.945124 14.9999 1.70995 14.9999H16.2903C17.0551 14.9999 17.5368 14.1763 17.1618 13.5097L9.87168 0.54941ZM9 4.97327C9.41421 4.97327 9.75 5.30905 9.75 5.72327V8.25265C9.75 8.66686 9.41421 9.00265 9 9.00265C8.58579 9.00265 8.25 8.66686 8.25 8.25265V5.72327C8.25 5.30905 8.58579 4.97327 9 4.97327ZM10 11.5001C10 10.9478 9.55229 10.5001 9 10.5001C8.44772 10.5001 8 10.9478 8 11.5001V11.5687C8 12.121 8.44772 12.5687 9 12.5687C9.55229 12.5687 10 12.121 10 11.5687V11.5001Z" fill="black"/>
    </svg>
    <div id="error-message"></div>
    <div id="error-description"></div>
    <br />
    <button id="retry-button" onclick="hideError(); loadingScreenAPI.retryButtonPressed();" />
  </div>
</body>
</html>
