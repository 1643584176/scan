<body style="font-family:Consolas;font-size:14px;padding:24px;line-height:1.6">
<h2>操作步骤</h2>
<p><b>1.</b> 点击下方链接 → 会打开<b>微软官方登录页</b>(新标签页,不是弹窗)</p>
<p><b>2.</b> 用刚注册的微软账号登录,点"同意/Yes"完成授权</p>
<p><b>3.</b> 页面会跳转到 <b>app.weavy.ai/signin?code=...&amp;state=...</b>(可能白屏或报错,<b>没关系</b>)</p>
<p><b>4.</b> 跳转后<b>立即</b>在地址栏按 <code>Ctrl+L</code>(聚焦地址栏)→ <code>Ctrl+C</code>(复制)→ 把完整 URL 发给我</p>
<p style="color:#c0392b"><b>如果地址栏已被清空</b>(weavy 页面 JS 清理了 URL):点浏览器"后退"回到微软授权页,再点一次授权,跳转瞬间盯着地址栏按 Ctrl+L / Ctrl+C。多试几次总能抓到。</p>
